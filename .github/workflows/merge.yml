name: merge

# Slow suites: on merge to master, not per push or PR.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  testcontainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t garbagebin:latest .
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: testcontainers/go/go.mod
          cache-dependency-path: testcontainers/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: testcontainers/java/*.gradle
      - run: go test ./...
        working-directory: testcontainers/go
      - run: uv run pytest -q
        working-directory: testcontainers/python
      - run: npm ci && npm test
        working-directory: testcontainers/js
      - run: ./gradlew test
        working-directory: testcontainers/java

  # Publishes only after the image passes the Testcontainers suites.
  docker:
    needs: testcontainers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/garbagebin
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/garbagebin
          readme-filepath: docs/dockerhub.md

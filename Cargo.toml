[package]
name = "garbagebin"
version = "0.5.1"
edition = "2024"
rust-version = "1.96"
description = "Garbage Bin: a single-node, S3-compatible object store for local development and integration tests"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "garbagebin"
path = "src/lib.rs"

[[bin]]
name = "gb"
path = "src/main.rs"

[dependencies]
# Protocol layer: S3 routing, SigV4, XML, aws-chunked, multipart plumbing.
s3s = "0.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "net", "sync", "io-util", "time"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio"] }
http = "1"
async-trait = "0.1"
futures = "0.3"
time = "0.3"
base64 = "0.22"
crc-fast = "1.10"
httpdate = "1"
form_urlencoded = "1"

# Storage.
redb = "4"
bytes = "1"
md-5 = "0.11"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config, logging, errors.
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
proptest = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1", features = ["default-client"] }
hyper = { version = "1", features = ["client"] }
http-body-util = "0.1"
tempfile = "3"
s3s-sigv4 = "0.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
